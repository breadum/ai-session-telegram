name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Windows' locale-based default text encoding (not UTF-8) makes the
      # test suite's own read_text()/write_text() calls (unlike the
      # production code, which always passes encoding="utf-8" explicitly)
      # mangle non-ASCII content. This is the standard PEP 540 fix.
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"

      - run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest

      - name: Secret scan
        shell: bash
        run: |
          if git grep -nE '[0-9]{8,}:AA[A-Za-z0-9_-]{30,}' -- . ':!*.yml'; then
            echo "::error::possible Telegram bot token committed"
            exit 1
          fi
